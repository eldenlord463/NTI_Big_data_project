<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>End-to-End Data Engineering Workflow — Project Defense</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/gsap@3.12.5/dist/gsap.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
<style>
/* ============================================================
   DESIGN TOKENS
   ============================================================ */
:root{
  --bg-0:#03050e; --bg-1:#060a1a; --bg-2:#0a1128;
  --cyan:#22d3ee; --blue:#3b82f6; --purple:#a855f7;
  --green:#34d399; --orange:#fb923c; --pink:#f472b6; --red:#fb7185;
  --txt:#eaf2ff; --txt-2:#a7b8d8; --txt-3:#6f82a6;
  --line:rgba(120,180,255,.14);
  --glass:linear-gradient(160deg,rgba(23,36,72,.72),rgba(7,12,28,.60));
  --shadow:0 22px 60px -20px rgba(0,0,0,.85), inset 0 1px 0 rgba(255,255,255,.05);
  --mono:'JetBrains Mono',ui-monospace,monospace;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;overflow:hidden;background:var(--bg-0);color:var(--txt);
  font-family:Inter,system-ui,-apple-system,'Segoe UI',sans-serif;-webkit-font-smoothing:antialiased}
body::after{content:"";position:fixed;inset:0;pointer-events:none;z-index:60;
  background:radial-gradient(ellipse at center,transparent 55%,rgba(0,0,0,.55) 100%)}

#bgfx{position:fixed;inset:0;z-index:0}
.bg-grid{position:fixed;inset:0;z-index:0;pointer-events:none;
  background-image:linear-gradient(rgba(90,160,255,.055) 1px,transparent 1px),
                   linear-gradient(90deg,rgba(90,160,255,.055) 1px,transparent 1px);
  background-size:64px 64px;
  -webkit-mask-image:radial-gradient(ellipse at 50% 45%,#000 20%,transparent 78%);
          mask-image:radial-gradient(ellipse at 50% 45%,#000 20%,transparent 78%)}
.bg-orb{position:fixed;border-radius:50%;filter:blur(120px);opacity:.5;z-index:0;pointer-events:none}
.orb-a{width:620px;height:620px;left:-160px;top:-180px;background:rgba(59,130,246,.30)}
.orb-b{width:560px;height:560px;right:-150px;top:-120px;background:rgba(168,85,247,.24)}
.orb-c{width:640px;height:640px;right:8%;bottom:-260px;background:rgba(34,211,238,.16)}

/* ============================================================
   STAGE (fixed 1600x900, auto-scaled)
   ============================================================ */
#viewport{position:fixed;inset:0;z-index:5;display:grid;place-items:center}
#stage{width:1600px;height:900px;position:relative;transform-origin:center center}
.slide{position:absolute;inset:0;padding:58px 76px 78px;display:none;flex-direction:column;gap:26px}
.slide.on{display:flex}

/* ============================================================
   TYPOGRAPHY & PRIMITIVES
   ============================================================ */
.kicker{display:flex;align-items:center;gap:14px;font-size:13px;font-weight:700;letter-spacing:.22em;
  text-transform:uppercase;color:var(--cyan)}
.kicker .num{font-family:var(--mono);font-size:12px;color:#04121c;background:var(--cyan);
  padding:4px 9px;border-radius:6px;letter-spacing:.05em;box-shadow:0 0 22px rgba(34,211,238,.55)}
.kicker .bar{flex:1;height:1px;background:linear-gradient(90deg,rgba(34,211,238,.6),transparent)}
h2.stitle{font-size:50px;font-weight:900;letter-spacing:-.028em;line-height:1.03;margin-top:12px}
h2.stitle em{font-style:normal;background:linear-gradient(100deg,var(--cyan),var(--blue) 45%,var(--purple));
  -webkit-background-clip:text;background-clip:text;color:transparent}
p.ssub{margin-top:9px;font-size:17px;color:var(--txt-2);max-width:1100px;line-height:1.5}
.body{flex:1;min-height:0;display:flex;flex-direction:column;gap:20px}

.card{position:relative;background:var(--glass);border:1px solid var(--line);border-radius:20px;
  box-shadow:var(--shadow);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);padding:22px 24px;overflow:hidden}
.card::before{content:"";position:absolute;left:0;top:0;height:2px;width:100%;
  background:linear-gradient(90deg,transparent,var(--c,var(--cyan)),transparent);opacity:.85}
.card.plain::before{display:none}
.card h4{font-size:18px;font-weight:700;letter-spacing:-.01em;display:flex;align-items:center;gap:10px}
.card p{font-size:14.5px;color:var(--txt-2);line-height:1.55;margin-top:9px}
.card .ico{width:38px;height:38px;border-radius:11px;display:grid;place-items:center;font-size:19px;
  background:color-mix(in srgb,var(--c,var(--cyan)) 16%,transparent);
  border:1px solid color-mix(in srgb,var(--c,var(--cyan)) 42%,transparent);
  color:var(--c,var(--cyan));box-shadow:0 0 22px -6px var(--c,var(--cyan))}
.grid{display:grid;gap:18px}
.g2{grid-template-columns:repeat(2,1fr)}.g3{grid-template-columns:repeat(3,1fr)}
.g4{grid-template-columns:repeat(4,1fr)}.g5{grid-template-columns:repeat(5,1fr)}
.g6{grid-template-columns:repeat(6,1fr)}
.row{display:flex;gap:18px}.col{display:flex;flex-direction:column;gap:18px}
.fill{flex:1;min-height:0}

.tag{display:inline-flex;align-items:center;gap:8px;padding:7px 14px;border-radius:999px;font-size:12.5px;
  font-weight:600;letter-spacing:.09em;text-transform:uppercase;color:var(--txt);
  border:1px solid color-mix(in srgb,var(--c,var(--cyan)) 40%,transparent);
  background:color-mix(in srgb,var(--c,var(--cyan)) 12%,transparent)}
.tag i{width:7px;height:7px;border-radius:50%;background:var(--c,var(--cyan));
  box-shadow:0 0 12px var(--c,var(--cyan));font-style:normal}
.tag.no{--c:var(--red);text-decoration:none}
.taglist{display:flex;flex-wrap:wrap;gap:10px}

.stat{position:relative;text-align:left}
.stat .v{font-size:64px;font-weight:900;letter-spacing:-.045em;line-height:1;
  background:linear-gradient(180deg,#fff,var(--c,var(--cyan)));-webkit-background-clip:text;background-clip:text;color:transparent;
  filter:drop-shadow(0 0 26px color-mix(in srgb,var(--c,var(--cyan)) 40%,transparent))}
.stat .l{margin-top:10px;font-size:12.5px;letter-spacing:.2em;text-transform:uppercase;color:var(--txt-3);font-weight:600}

ul.ticks{margin-top:12px;display:flex;flex-direction:column;gap:9px}
ul.ticks li{list-style:none;display:flex;gap:11px;font-size:14.5px;color:var(--txt-2);line-height:1.45}
ul.ticks li::before{content:"▸";color:var(--c,var(--cyan));font-size:13px;line-height:1.5}

.mono{font-family:var(--mono)}
.code{font-family:var(--mono);font-size:13.5px;line-height:1.75;color:#cfe3ff;background:rgba(3,8,20,.72);
  border:1px solid var(--line);border-radius:14px;padding:16px 18px;overflow:hidden}
.code .k{color:#7dd3fc;font-weight:600}.code .f{color:var(--orange)}.code .s{color:#86efac}
.code .c{color:#5c6f92;font-style:italic}

.hl{color:#fff;font-weight:600}
.dim{color:var(--txt-3)}
.center{text-align:center}

/* flow chain */
.chain{display:flex;align-items:stretch;gap:0;width:100%}
.chain .node{flex:1;text-align:center;padding:16px 8px;border-radius:16px;border:1px solid var(--line);
  background:linear-gradient(180deg,rgba(20,32,66,.75),rgba(6,11,26,.6));position:relative}
.chain .node .t{font-size:14px;font-weight:700}
.chain .node .d{font-size:11.5px;color:var(--txt-3);margin-top:5px;letter-spacing:.04em}
.chain .node .e{font-size:22px}
.chain .arw{display:grid;place-items:center;width:34px;color:var(--cyan);font-size:16px;opacity:.85}

/* browser mock */
.browser{border-radius:18px;border:1px solid var(--line);background:rgba(5,10,24,.78);overflow:hidden;
  box-shadow:var(--shadow);display:flex;flex-direction:column}
.browser .bar{display:flex;align-items:center;gap:8px;padding:11px 14px;background:rgba(12,20,44,.9);
  border-bottom:1px solid var(--line)}
.browser .dot{width:11px;height:11px;border-radius:50%}
.browser .url{flex:1;margin-left:10px;font-family:var(--mono);font-size:11.5px;color:var(--txt-3);
  background:rgba(0,0,0,.35);border-radius:7px;padding:5px 12px}
.kpi{border-radius:14px;border:1px solid var(--line);padding:13px 15px;background:rgba(12,20,44,.6)}
.kpi .l{font-size:10.5px;letter-spacing:.18em;text-transform:uppercase;color:var(--txt-3)}
.kpi .v{font-size:27px;font-weight:800;margin-top:6px;color:var(--c,var(--cyan))}
.filters{display:flex;gap:8px;flex-wrap:wrap}
.filters button{font:inherit;font-size:12px;font-weight:600;padding:7px 14px;border-radius:999px;cursor:pointer;
  color:var(--txt-2);background:rgba(255,255,255,.05);border:1px solid var(--line);transition:.2s}
.filters button:hover{color:#fff;border-color:rgba(34,211,238,.5)}
.filters button.act{color:#04121c;background:var(--cyan);border-color:var(--cyan);box-shadow:0 0 20px rgba(34,211,238,.45)}

/* confusion matrix */
.cm{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
.cm div{border-radius:12px;padding:14px;text-align:center;border:1px solid var(--line);background:rgba(12,20,44,.6)}
.cm .lab{font-size:11px;letter-spacing:.16em;color:var(--txt-3);text-transform:uppercase}
.cm .val{font-size:24px;font-weight:800;margin-top:6px;font-family:var(--mono)}

/* sponsor */
.sponsor{position:relative;border-radius:22px;overflow:hidden;border:1px solid rgba(52,211,153,.35);
  background:linear-gradient(120deg,rgba(6,26,20,.95),rgba(8,20,16,.85));box-shadow:0 0 60px -18px rgba(52,211,153,.5)}
.sponsor .ph{position:absolute;inset:0;background-size:cover;background-position:center;opacity:.42}
.sponsor .veil{position:absolute;inset:0;
  background:linear-gradient(90deg,rgba(3,12,9,.97) 34%,rgba(3,12,9,.55) 62%,rgba(3,12,9,.2))}
.sponsor .in{position:relative;padding:26px 30px}
.sponsor .ar{font-size:13px;letter-spacing:.34em;color:#6ee7b7;font-weight:700;direction:rtl}
.sponsor .brand{font-size:56px;font-weight:900;letter-spacing:.14em;line-height:1;margin-top:8px;
  background:linear-gradient(100deg,#a7f3d0,#34d399 55%,#fbbf24);-webkit-background-clip:text;background-clip:text;color:transparent}
.sponsor .slog{margin-top:8px;font-size:14px;letter-spacing:.28em;color:#d1fae5;text-transform:uppercase}
.sponsor .leaf{position:absolute;right:20px;top:16px;font-size:20px;opacity:.6}

/* ============================================================
   HUD
   ============================================================ */
.hud{position:fixed;z-index:40;display:flex;align-items:center;gap:12px}
.hud.tl{top:20px;left:24px}.hud.tr{top:20px;right:24px}
.hud.bl{bottom:20px;left:24px}.hud.br{bottom:20px;right:24px}
.pill{display:flex;align-items:center;gap:11px;padding:9px 15px;border-radius:999px;
  background:rgba(6,12,28,.8);border:1px solid var(--line);backdrop-filter:blur(14px);font-size:12.5px}
.pill .lg{width:9px;height:9px;border-radius:50%;background:var(--green);box-shadow:0 0 12px var(--green);
  animation:blink 2.4s infinite}
@keyframes blink{0%,100%{opacity:1}50%{opacity:.35}}
.btn{width:42px;height:42px;border-radius:13px;display:grid;place-items:center;cursor:pointer;color:var(--txt);
  background:rgba(6,12,28,.82);border:1px solid var(--line);backdrop-filter:blur(14px);font-size:16px;transition:.2s}
.btn:hover{border-color:rgba(34,211,238,.55);color:var(--cyan);transform:translateY(-2px);
  box-shadow:0 8px 26px -10px rgba(34,211,238,.7)}
#counter{font-family:var(--mono);font-size:13px;letter-spacing:.06em}
#counter b{color:var(--cyan);font-weight:700}
#track{position:fixed;left:0;bottom:0;height:3px;width:100%;background:rgba(255,255,255,.05);z-index:45}
#bar{height:100%;width:0;background:linear-gradient(90deg,var(--cyan),var(--blue),var(--purple));
  box-shadow:0 0 16px rgba(34,211,238,.8);transition:width .5s cubic-bezier(.4,0,.2,1)}
.sponsor-badge{display:flex;align-items:center;gap:10px;padding:8px 15px;border-radius:999px;
  background:linear-gradient(100deg,rgba(6,32,24,.9),rgba(8,20,16,.75));border:1px solid rgba(52,211,153,.4);
  backdrop-filter:blur(14px)}
.sponsor-badge .a{font-size:10px;letter-spacing:.2em;color:#6ee7b7;direction:rtl}
.sponsor-badge .b{font-size:15px;font-weight:900;letter-spacing:.16em;color:#d1fae5}

/* overview */
#ov{position:fixed;inset:0;z-index:70;background:rgba(2,5,14,.93);backdrop-filter:blur(16px);
  padding:70px 60px;display:none;overflow:auto}
#ov.on{display:block}
#ov h3{font-size:22px;font-weight:800;letter-spacing:.16em;text-transform:uppercase;color:var(--cyan);margin-bottom:8px}
#ov .sub{color:var(--txt-3);font-size:13px;margin-bottom:26px}
#ovg{display:grid;grid-template-columns:repeat(5,1fr);gap:14px}
.ovc{cursor:pointer;border-radius:14px;border:1px solid var(--line);background:var(--glass);padding:16px;
  transition:.2s;text-align:left;color:var(--txt);font:inherit}
.ovc:hover{border-color:rgba(34,211,238,.55);transform:translateY(-3px)}
.ovc.act{border-color:var(--cyan);box-shadow:0 0 28px -8px var(--cyan)}
.ovc .n{font-family:var(--mono);font-size:11px;color:var(--cyan)}
.ovc .t{font-size:13.5px;font-weight:600;margin-top:7px;line-height:1.35}

/* svg helpers */
svg .lbl{font-family:Inter,sans-serif;font-weight:700;fill:#eaf2ff}
svg .sub{font-family:Inter,sans-serif;fill:#8ea3c8}
svg .mono{font-family:'JetBrains Mono',monospace}
.reveal{opacity:0}
@media (max-width:820px){ #ovg{grid-template-columns:repeat(2,1fr)} #ov{padding:60px 20px} }
</style>
</head>
<body>
<canvas id="bgfx"></canvas>
<div class="bg-grid"></div>
<div class="bg-orb orb-a"></div><div class="bg-orb orb-b"></div><div class="bg-orb orb-c"></div>

<div id="viewport"><div id="stage"></div></div>

<div class="hud tl"><div class="pill"><span class="lg"></span><span class="mono" style="letter-spacing:.14em">BIG&nbsp;DATA&nbsp;PROJECT&nbsp;DEFENSE</span></div></div>
<div class="hud tr">
  <button class="btn" id="bOv" title="Overview (O)">▦</button>
  <button class="btn" id="bFs" title="Fullscreen (F)">⛶</button>
</div>
<div class="hud bl"><div class="pill" id="counter"><b>01</b> / 20 <span class="dim" style="margin-left:8px" id="cname">Title</span></div></div>
<div class="hud br">
  <button class="btn" id="bPrev" title="Previous (←)">←</button>
  <button class="btn" id="bNext" title="Next (→)">→</button>
</div>
<div id="track"><div id="bar"></div></div>

<div id="ov"><h3>Presentation Overview</h3><div class="sub">Click any slide to jump • press O to close</div><div id="ovg"></div></div>

<script>
/* ================================================================
   0. CONSTANTS
   ================================================================ */
const SPONSOR_IMG = "https://images.pexels.com/photos/5112582/pexels-photo-5112582.jpeg?auto=compress&cs=tinysrgb&fit=crop&h=627&w=1200";
const CLR = {cyan:'var(--cyan)',blue:'var(--blue)',purple:'var(--purple)',green:'var(--green)',
             orange:'var(--orange)',pink:'var(--pink)',red:'var(--red)'};

/* ================================================================
   1. REUSABLE COMPONENTS
   ================================================================ */
const card = ({icon='',title='',text='',list=[],c='cyan',cls='',extra=''}) => `
  <div class="card reveal ${cls}" style="--c:${CLR[c]}">
    ${icon||title?`<h4>${icon?`<span class="ico">${icon}</span>`:''}${title}</h4>`:''}
    ${text?`<p>${text}</p>`:''}
    ${list.length?`<ul class="ticks" style="--c:${CLR[c]}">${list.map(l=>`<li>${l}</li>`).join('')}</ul>`:''}
    ${extra}
  </div>`;

const stat = (v,l,c='cyan',dec=0,suf='',pre='') => `
  <div class="card reveal stat" style="--c:${CLR[c]}">
    <div class="v">${pre}<span class="num" data-to="${v}" data-dec="${dec}">0</span>${suf}</div>
    <div class="l">${l}</div>
  </div>`;

const tag = (t,c='cyan') => `<span class="tag" style="--c:${CLR[c]}"><i></i>${t}</span>`;
const noTag = t => `<span class="tag no"><i style="background:var(--red);box-shadow:0 0 12px var(--red)"></i>${t}</span>`;

const chain = items => `<div class="chain reveal">${items.map((it,i)=>`
   ${i?`<div class="arw">→</div>`:''}
   <div class="node" style="border-color:color-mix(in srgb,${CLR[it.c||'cyan']} 34%,transparent)">
     <div class="e">${it.e||''}</div>
     <div class="t" style="color:${CLR[it.c||'cyan']}">${it.t}</div>
     <div class="d">${it.d||''}</div>
   </div>`).join('')}</div>`;

const header = s => s.custom ? '' : `
  <header class="reveal">
    <div class="kicker"><span class="num">${String(s.n).padStart(2,'0')}</span>${s.kicker}<span class="bar"></span></div>
    <h2 class="stitle">${s.title}</h2>
    ${s.sub?`<p class="ssub">${s.sub}</p>`:''}
  </header>`;

/* --- SVG helpers ------------------------------------------------ */
const defs = `<defs>
  <linearGradient id="gFlow" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0%" stop-color="#22d3ee"/><stop offset="50%" stop-color="#3b82f6"/><stop offset="100%" stop-color="#a855f7"/></linearGradient>
  <filter id="glow" x="-60%" y="-60%" width="220%" height="220%">
    <feGaussianBlur stdDeviation="5" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  <marker id="arw" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
    <path d="M0 0 L10 5 L0 10 z" fill="#38bdf8"/></marker>
  <marker id="arwG" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
    <path d="M0 0 L10 5 L0 10 z" fill="#34d399"/></marker>
</defs>`;

const svgBox = (x,y,w,h,color,r=16,extra='') =>
  `<rect x="${x}" y="${y}" width="${w}" height="${h}" rx="${r}" fill="${color}22" stroke="${color}" stroke-width="1.6" ${extra}/>`;

/* particle travelling along a path */
const flowDot = (path,dur,delay=0,r=5,fill='#22d3ee') => `
  <circle r="${r}" fill="${fill}" filter="url(#glow)" opacity=".95">
    <animateMotion dur="${dur}s" begin="${delay}s" repeatCount="indefinite" path="${path}"/>
    <animate attributeName="opacity" values="0;1;1;0" dur="${dur}s" begin="${delay}s" repeatCount="indefinite"/>
  </circle>`;

/* ================================================================
   2. BIG DIAGRAMS
   ================================================================ */
const ARCH_NODES = [
  {t:'KAGGLE',       s:['Source dataset','Multiple CSV'], c:'#22d3ee', e:'⤓'},
  {t:'HADOOP HDFS',  s:['/data/raw/','NameNode + DataNode'], c:'#34d399', e:'▤'},
  {t:'APACHE SPARK', s:['PySpark · BATCH','Reads from DataNodes'], c:'#fb923c', e:'✦'},
  {t:'SPARK SQL',    s:['Joins · Window fn','Analytical tables'], c:'#3b82f6', e:'⌗'},
  {t:'SPARK MLlib',  s:['Classification','Regression'], c:'#a855f7', e:'◈'},
  {t:'MATPLOTLIB',   s:['Charts & figures','Insight rendering'], c:'#fbbf24', e:'◔'},
  {t:'HTML DASHBOARD',s:['HTML · CSS · JS','Interactive output'], c:'#f472b6', e:'▣'}
];

function architectureSVG(){
  const W=168,STEP=192,X0=64,Y=250,H=176;
  let nodes='',arrows='',drops='';
  ARCH_NODES.forEach((n,i)=>{
    const x=X0+i*STEP, cx=x+W/2;
    nodes+=`<g class="anode" style="opacity:0">
      ${svgBox(x,Y,W,H,n.c,18)}
      <text class="lbl" x="${cx}" y="${Y+42}" text-anchor="middle" font-size="24" fill="${n.c}" opacity=".9">${n.e}</text>
      <text class="lbl" x="${cx}" y="${Y+78}" text-anchor="middle" font-size="${n.t.length>12?14:16}">${n.t}</text>
      <text class="sub" x="${cx}" y="${Y+110}" text-anchor="middle" font-size="12.5">${n.s[0]}</text>
      <text class="sub" x="${cx}" y="${Y+132}" text-anchor="middle" font-size="12.5">${n.s[1]}</text>
      <rect x="${x+22}" y="${Y+H-16}" width="${W-44}" height="3" rx="2" fill="${n.c}" opacity=".7"/>
    </g>`;
    if(i<ARCH_NODES.length-1){
      arrows+=`<path d="M${x+W+4} ${Y+H/2} H${x+STEP-6}" stroke="url(#gFlow)" stroke-width="2.4" marker-end="url(#arw)" opacity=".85"/>`;
    }
    drops+=`<path d="M${cx} 118 V${Y-10}" stroke="#34d399" stroke-width="1.3" stroke-dasharray="5 7" opacity=".42" marker-end="url(#arwG)"/>`;
  });
  const flowPath=`M${X0+8} ${Y+H+56} H${X0+6*STEP+W-8}`;
  return `<svg viewBox="0 0 1440 620" style="width:100%;height:100%">${defs}
    <!-- orchestration -->
    <g class="airflow-bar" style="opacity:0">
      ${svgBox(120,42,1200,68,'#34d399',20)}

function dagSVG(){
  const n=[{t:'start',c:'#22d3ee'},{t:'load_kaggle_csv',c:'#22d3ee'},{t:'put_to_hdfs',c:'#34d399'},
           {t:'spark_batch_clean',c:'#fb923c'},{t:'spark_sql_analytics',c:'#3b82f6'},
           {t:'write_processed',c:'#34d399'},{t:'mllib_train',c:'#a855f7'},{t:'matplotlib_render',c:'#fbbf24'},
           {t:'build_dashboard',c:'#f472b6'},{t:'end',c:'#22d3ee'}];
  const X0=60,STEP=124,Y=[150,240];
  let g='';
  n.forEach((d,i)=>{
    const row=i<5?0:1, idx=i<5?i:9-i;
    const x=X0+idx*STEP*1.6, y=Y[row]+(row?120:0);
    d._x=x+58;d._y=y+26;
    g+=`<g class="dnode" style="opacity:0">
      <rect x="${x}" y="${y}" width="116" height="52" rx="12" fill="${d.c}20" stroke="${d.c}" stroke-width="1.5"/>
      <circle cx="${x+14}" cy="${y+26}" r="4.5" fill="${d.c}"/>
      <text class="mono" x="${x+26}" y="${y+30}" font-size="9.6" fill="#dbeafe">${d.t}</text></g>`;
  });
  let links='';
  for(let i=0;i<n.length-1;i++){
    const a=n[i],b=n[i+1];
    links+= (i===4)
      ? `<path d="M${a._x} ${a._y+26} V${b._y-26}" stroke="#38bdf8" stroke-width="1.5" opacity=".6" marker-end="url(#arw)"/>`
      : `<path d="M${Math.min(a._x,b._x)+58} ${a._y} H${Math.max(a._x,b._x)-58}" stroke="#38bdf8" stroke-width="1.5" opacity=".6" ${a._x<b._x?'marker-end="url(#arw)"':'marker-start="url(#arw)"'}/>`;
  }
  return `<svg viewBox="0 0 1060 480" style="width:100%;height:100%">${defs}${links}${g}
    <text class="mono" x="60" y="462" font-size="11" fill="#6f82a6">dag_id = "end_to_end_data_engineering" · schedule = "@daily" · retries = 2 · catchup = False</text>
    <text class="mono" x="1000" y="462" text-anchor="end" font-size="11" fill="#34d399">● all tasks green</text>
  </svg>`;
}

/* ---------- 01 TITLE ---------- */
{n:1,name:'Title',custom:true,body:`
  <div style="display:flex;flex-direction:column;height:100%;gap:20px">
    <div class="row" style="align-items:flex-start;gap:34px">
      <div style="flex:1.35">
        <div class="kicker reveal"><span class="num">01</span>Final Year Big Data Project<span class="bar"></span></div>
        <h1 class="reveal" style="font-size:74px;font-weight:900;letter-spacing:-.045em;line-height:.98;margin-top:20px">
          END-TO-END<br><em style="font-style:normal;background:linear-gradient(100deg,var(--cyan),var(--blue) 42%,var(--purple));-webkit-background-clip:text;background-clip:text;color:transparent">DATA ENGINEERING</em><br>WORKFLOW</h1>
        <p class="ssub reveal" style="font-size:20px;margin-top:18px;max-width:720px">
          We transformed 42.45 million raw e-commerce events into scalable analytics and predictive business intelligence — fully local, fully containerised, fully orchestrated.</p>
        <div class="taglist reveal" style="margin-top:26px">
          ${tag('5.5 GB dataset','cyan')}${tag('42,448,764 events','purple')}${tag('Local Docker environment','green')}${tag('Spark batch processing','orange')}
        </div>
      </div>
      <div style="flex:1;display:flex;flex-direction:column;gap:16px">
        <div class="card reveal plain" style="padding:20px 22px">
          <div class="mono" style="font-size:11px;letter-spacing:.2em;color:var(--txt-3)">PIPELINE AT A GLANCE</div>
          <div style="margin-top:14px;display:flex;flex-direction:column;gap:9px">
            ${[['CSV','Kaggle source files','cyan'],['HDFS','Distributed raw storage','green'],['SPARK','Batch transformations','orange'],
               ['SPARK SQL','Analytical queries','blue'],['XGBoost','Feature Eng & ML Models','purple'],['MATPLOTLIB','Business Insights','orange'],
               ['DASHBOARD','HTML · CSS · JS','pink']].map((r,i)=>`
              <div class="prow" style="display:flex;align-items:center;gap:12px;opacity:0">
                <span class="mono" style="font-size:10px;color:var(--txt-3);width:16px">${String(i+1).padStart(2,'0')}</span>
                <span style="width:8px;height:8px;border-radius:50%;background:${CLR[r[2]]};box-shadow:0 0 12px ${CLR[r[2]]}"></span>
                <span style="font-size:14px;font-weight:700;width:112px">${r[0]}</span>
                <span style="font-size:12.5px;color:var(--txt-3)">${r[1]}</span>
              </div>`).join('')}
          </div>
        </div>
      </div>
    </div>
    <div class="card reveal plain fill" style="padding:0;overflow:hidden">${architectureSVG()}</div>
  </div>`},

/* ---------- 02 PROBLEM ---------- */
{n:3,name:'The Problem',kicker:'Business Problem',
 title:'WHY THIS PROJECT <em>EXISTS</em>',
 sub:'The e-commerce platform generates millions of customer interaction events, but raw event-level data is difficult to process and does not directly provide actionable business intelligence.',
 body:`
  <div class="row fill">
    <div class="col" style="flex:1.05">
      ${card({icon:'⚠',c:'red',title:'The bottleneck',text:'Loading 42.45M events into a single machine or spreadsheet exhausts memory long before analysis begins.'})}
      ${card({icon:'🕳',c:'purple',title:'Raw data vs Insights',text:'Event-level logs (<span class="mono">view, cart, purchase</span>) do not inherently explain user behaviour or predict future revenue.'})}
    </div>
    <div class="col" style="flex:1.25">
      <div class="card reveal" style="--c:var(--green)">
        <h4><span class="ico">✔</span>The Project Goal</h4>
        <p>Turn large-scale e-commerce events into scalable analytics, structured business insights, and predictive machine learning models.</p>
        <div style="margin-top:16px">${chain([
          {t:'Store',d:'HDFS',c:'green',e:'▤'},{t:'Process',d:'Spark batch',c:'orange',e:'✦'},
          {t:'Analyse',d:'Spark SQL',c:'blue',e:'⌗'},{t:'Model',d:'XGBoost',c:'purple',e:'◈'},
          {t:'Deliver',d:'Dashboard',c:'pink',e:'▣'}])}</div>
      </div>
      <div class="grid g2 fill">
        ${card({icon:'∞',c:'cyan',title:'Scale, not luck',text:'Adding data means adding nodes — the design does not break at the next dataset.'})}
        ${card({icon:'🐳',c:'blue',title:'Runs on one laptop',text:'Docker Compose reproduces a cluster-like environment locally, with zero cloud cost.'})}
      </div>
      <div class="card reveal plain" style="padding:16px 22px">
        <div class="taglist">${noTag('No Kafka')}${noTag('No streaming')}${noTag('No Databricks')}${tag('Pure batch architecture','green')}</div>
      </div>
    </div>
  </div>`},

/* ---------- 04 DATASET ---------- */
{n:4,name:'Dataset',kicker:'The data',
 title:'A DATASET BUILT FOR <em>DISTRIBUTED</em> PROCESSING',
 sub:'A structured, multi-file Kaggle dataset — large enough that distribution stops being optional and becomes a requirement.',
 body:`
  <div class="grid g4">
    ${stat(5.5,'Total size','cyan',1,' GB')}
    ${stat(42.45,'Events','purple',2,'M')}
    ${stat(9,'Columns','orange')}
    ${stat(100,'Structured / tabular','green',0,'%')}
  </div>
  <div class="row fill">
    <div class="col" style="flex:1.15">
      ${card({icon:'📁',c:'cyan',title:'Event Schema',list:[
        '<span class="hl">Temporal:</span> event_time',
        '<span class="hl">Action:</span> event_type (view, cart, remove_from_cart, purchase)',
        '<span class="hl">Product Info:</span> product_id, category_id, category_code, brand, price',
        '<span class="hl">Identity:</span> user_id, user_session'
      ]})}
      ${card({icon:'🛡',c:'green',title:'Immutable Source of Truth',text:'All raw CSV files stay untouched in /data/raw/ to enable reproducible processing pipelines.'})}
    </div>
    <div class="col" style="flex:1">
      ${card({icon:'⤓',c:'cyan',title:'Kaggle origin',text:'A public, well-documented dataset — realistic column diversity, real-world messiness, no synthetic filler.'})}
      ${card({icon:'🔒',c:'green',title:'Raw files are preserved',text:'Nothing is overwritten. Every transformation writes to a separate processed layer so the pipeline can always be re-run from source.'})}
      ${card({icon:'⚡',c:'orange',title:'Why this size matters',text:'At this volume partitioning, parallelism and memory management stop being theory and become measurable engineering choices.'})}
    </div>
  </div>`},

/* ---------- 06 DOCKER ---------- */
{n:6,name:'Docker Environment',kicker:'Infrastructure',
 title:'ONE COMMAND, <em>WHOLE CLUSTER</em>',
 sub:'Every service is a container defined in a single docker-compose.yml — identical on any machine, every time.',
 body:`
  <div class="row fill">
    <div style="flex:1.1;display:flex;flex-direction:column;gap:16px">
      ${card({icon:'🐳',c:'cyan',title:'docker-compose.yml Stack',text:'Declarative container configuration for the complete local big data environment.',
        list:[
          '<span class="hl">NameNode</span> — HDFS master service & namespace metadata (UI :9870)',
          '<span class="hl">DataNode</span> — Dedicated block storage daemon',
          '<span class="hl">Spark Engine</span> — PySpark batch compute cluster (UI :8080)',
          '<span class="hl">Airflow Orchestrator</span> — DAG scheduler & management dashboard (UI :8081)'
        ]})}
    </div>
    <div style="flex:1;display:flex;flex-direction:column;gap:16px">
      <div class="grid g2">
        ${card({icon:'▤',c:'green',title:'NameNode',text:'Namespace, block map and cluster metadata.'})}
        ${card({icon:'▥',c:'green',title:'DataNode',text:'Physical block storage for data blocks.'})}
        ${card({icon:'✦',c:'orange',title:'Spark',text:'Driver + executors for batch jobs.'})}
        ${card({icon:'◈',c:'purple',title:'Airflow',text:'Scheduler, webserver and task logs.'})}
      </div>
      ${card({c:'blue',icon:'✔',title:'Why containerise?',
        list:['<span class="hl">Reproducible</span> — same versions, same config, any machine','<span class="hl">Isolated</span> — services cannot corrupt each other',
              '<span class="hl">Fast to deploy</span> — <span class="mono">docker compose up -d</span> boots the stack',
              '<span class="hl">Disposable</span> — tear down and rebuild without residue']})}
    </div>
  </div>`},

{n:7,name:'HDFS Storage',kicker:'Storage layer',
 title:'HADOOP <em>HDFS</em> — DISTRIBUTED STORAGE',

    <div class="col" style="flex:.85">

      ${card({icon:'⚡',c:'orange',title:'High throughput',text:'Optimised for large sequential batch reads — exactly what Spark needs.'})}
    </div>
  </div>`},

/* ---------- 08 INGESTION ---------- */
{n:8,name:'Data Ingestion',kicker:'Ingestion',
 title:'RAW DATA LANDS <em>FIRST</em>',
 sub:'Before a single transformation runs, every CSV file is written unmodified into the HDFS raw zone.',
 body:`
  <div class="card reveal plain" style="padding:22px">
    ${chain([{t:'KAGGLE',d:'download source',c:'cyan',e:'⤓'},{t:'LOCAL STAGING',d:'checksum + verify',c:'blue',e:'▤'},
             {t:'hdfs dfs -put',d:'ingestion command',c:'orange',e:'⇪'},{t:'/data/raw/',d:'immutable raw zone',c:'green',e:'▥'},
             {t:'BLOCK SPLIT',d:'stored in DataNode',c:'green',e:'▨'}])}
  </div>
  <div class="row fill">
    <div class="col" style="flex:1.15">
      ${card({icon:'⇪',c:'orange',title:'Ingestion Task Pipeline',list:[
        '<span class="hl">Directory setup</span> — Prepare target raw zone /data/raw in HDFS',
        '<span class="hl">HDFS Upload</span> — Transfer raw Kaggle CSV files into HDFS storage',
        '<span class="hl">Integrity Check</span> — Confirm full 5.5 GB volume and file count on arrival',
        '<span class="hl">Direct Spark Interface</span> — Read raw HDFS folder directly without copy steps'
      ]})}

}

    {opacity:1,y:0,scale:1,duration:.5,stagger:.07,delay:.25,ease:'back.out(1.5)',transformOrigin:'center'});
  gsap.fromTo(el.querySelectorAll('.airflow-bar,.docker-box'),{opacity:0},{opacity:1,duration:.7,delay:.55});
  gsap.fromTo(el.querySelectorAll('.pnode'),{opacity:0,y:18},{opacity:1,y:0,duration:.42,stagger:.06,delay:.2,ease:'power2.out'});

/* ================================================================
   7. NAVIGATION
   ================================================================ */
let cur=0, busy=false;
function go(i,dir){
  i=(i+TOTAL)%TOTAL;
  if(i===cur||busy) return;
  dir = dir!==undefined ? dir : (i>cur?1:-1);
  busy=true;
  const outEl=slides[cur], inEl=slides[i];
  gsap.to(outEl,{opacity:0,x:-38*dir,duration:.28,ease:'power2.in',onComplete(){
    outEl.classList.remove('on'); gsap.set(outEl,{x:0});
    inEl.classList.add('on');
    gsap.fromTo(inEl,{opacity:0,x:44*dir},{opacity:1,x:0,duration:.45,ease:'power3.out',onComplete(){busy=false}});
    cur=i; playSlide(i); updHud();
  }});
}
function updHud(){
  document.getElementById('counter').innerHTML=
    `<b>${String(cur+1).padStart(2,'0')}</b> / ${TOTAL} <span class="dim" style="margin-left:8px">${SLIDES[cur].name}</span>`;
  document.getElementById('bar').style.width=((cur+1)/TOTAL*100)+'%';
  ovg.querySelectorAll('.ovc').forEach((b,i)=>b.classList.toggle('act',i===cur));
}
const next=()=>go(cur+1,1), prev=()=>go(cur-1,-1);
document.getElementById('bNext').onclick=next;
document.getElementById('bPrev').onclick=prev;
function toggleOv(f){document.getElementById('ov').classList.toggle('on',f!==undefined?f:!document.getElementById('ov').classList.contains('on'))}
document.getElementById('bOv').onclick=()=>toggleOv();
document.getElementById('bFs').onclick=()=>{
  document.fullscreenElement?document.exitFullscreen():document.documentElement.requestFullscreen().catch(()=>{})};
window.addEventListener('keydown',e=>{
  const k=e.key.toLowerCase();
  if(['arrowright','pagedown',' '].includes(k)){e.preventDefault();next()}
  else if(['arrowleft','pageup'].includes(k)){e.preventDefault();prev()}
  else if(k==='home')go(0); else if(k==='end')go(TOTAL-1);
  else if(k==='f')document.getElementById('bFs').click();
  else if(k==='o')toggleOv();
  else if(k==='escape')toggleOv(false);
});
/* swipe */
let tx=0;
window.addEventListener('touchstart',e=>tx=e.touches[0].clientX,{passive:true});
window.addEventListener('touchend',e=>{const d=e.changedTouches[0].clientX-tx;
  if(Math.abs(d)>60){d<0?next():prev()}},{passive:true});

/* ================================================================
   8. BACKGROUND PARTICLE NETWORK
   ================================================================ */
(function(){
  const c=document.getElementById('bgfx'),x=c.getContext('2d');
  let w,h,pts=[];
  function size(){w=c.width=innerWidth;h=c.height=innerHeight;
    const n=Math.min(80,Math.round(w*h/26000));
    pts=Array.from({length:n},()=>({x:Math.random()*w,y:Math.random()*h,
      vx:(Math.random()-.5)*.24,vy:(Math.random()-.5)*.24,r:Math.random()*1.6+.7,
      c:['#22d3ee','#3b82f6','#a855f7','#34d399'][Math.floor(Math.random()*4)]}));}
  size();addEventListener('resize',size);
  (function loop(){
    x.clearRect(0,0,w,h);
    for(let i=0;i<pts.length;i++){
      const p=pts[i];p.x+=p.vx;p.y+=p.vy;
      if(p.x<0||p.x>w)p.vx*=-1; if(p.y<0||p.y>h)p.vy*=-1;
      x.beginPath();x.arc(p.x,p.y,p.r,0,6.283);x.fillStyle=p.c;x.globalAlpha=.55;x.fill();
      for(let j=i+1;j<pts.length;j++){
        const q=pts[j],dx=p.x-q.x,dy=p.y-q.y,d=dx*dx+dy*dy;
        if(d<20000){x.beginPath();x.moveTo(p.x,p.y);x.lineTo(q.x,q.y);
          x.strokeStyle='#3b82f6';x.globalAlpha=.10*(1-d/20000);x.lineWidth=.8;x.stroke();}
      }
    }
    x.globalAlpha=1;requestAnimationFrame(loop);
  })();
})();
